services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    env_file: .env
    volumes: ["uploads:/app/data/uploads"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
  worker:
    build: .
    command: celery -A app.worker.celery_app worker --loglevel=INFO
    env_file: .env
    volumes: ["uploads:/app/data/uploads"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: jobs, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
    ports: ["5434:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres -d jobs"], interval: 5s, timeout: 3s, retries: 15}
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
volumes:
  pgdata:
  uploads:
